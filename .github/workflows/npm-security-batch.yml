name: NPM security batch

on:
  push:
    branches:
      - npm-security-batch

permissions:
  contents: read

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply direct dependency updates
        run: npm install --package-lock-only csv-parse@^7.0.2 nanoid@^5.1.16 vitest@^4.1.11

      - name: Apply transitive dependency updates
        run: npm update --package-lock-only fast-uri undici qs ip-address browserslist baseline-browser-mapping

      - name: Apply remaining non-breaking audit fixes
        run: npm audit fix --package-lock-only

      - name: Install exact resolved dependency tree
        run: npm ci

      - name: Capture audit report
        if: always()
        run: npm audit --json > audit.json || true

      - name: Require clean npm audit
        run: npm audit

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Production-equivalent bundle build
        run: npx vite build && node scripts/build-server.js

      - name: Record resolved versions
        if: always()
        run: npm ls fast-uri undici qs ip-address browserslist baseline-browser-mapping csv-parse nanoid vitest > dependency-versions.txt || true

      - name: Upload resolved dependency files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-batch-result
          path: |
            package.json
            package-lock.json
            audit.json
            dependency-versions.txt
