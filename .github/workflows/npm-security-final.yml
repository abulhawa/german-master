name: Refresh npm dependencies

on:
  push:
    branches:
      - npm-security-batch

permissions:
  contents: write

jobs:
  refresh-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: npm-security-batch

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh direct dependencies within current majors
        run: npx --yes npm-check-updates@latest --target minor -u

      - name: Refresh lockfile
        run: npm install --package-lock-only

      - name: Apply non-breaking security fixes
        run: npm audit fix --package-lock-only

      - name: Install exact resolved dependency tree
        run: npm ci

      - name: Require clean npm audit
        run: npm audit

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Production-equivalent bundle build
        run: npx vite build && node scripts/build-server.js

      - name: Show dependency changes
        run: git diff -- package.json package-lock.json

      - name: Commit verified dependency refresh
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: refresh npm dependencies [skip ci]"
          git push origin HEAD:npm-security-batch
